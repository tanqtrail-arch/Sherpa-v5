<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- シルバーグラデーション -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E2E8F0"/>
      <stop offset="30%" style="stop-color:#CBD5E1"/>
      <stop offset="70%" style="stop-color:#94A3B8"/>
      <stop offset="100%" style="stop-color:#64748B"/>
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <filter id="silverShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B44"/>
    </filter>
  </defs>

  <!-- 盾の形 -->
  <path d="M60,10 L105,25 L105,65 Q105,95 60,115 Q15,95 15,65 L15,25 Z" fill="url(#silverGrad)" filter="url(#silverShadow)"/>

  <!-- 内側の盾 -->
  <path d="M60,20 L95,32 L95,62 Q95,87 60,105 Q25,87 25,62 L25,32 Z" fill="url(#silverInner)"/>

  <!-- 山アイコン -->
  <g transform="translate(60, 50)">
    <text text-anchor="middle" font-size="28" dominant-baseline="middle">⛰️</text>
  </g>

  <!-- ALT数値 -->
  <text x="60" y="85" text-anchor="middle" font-size="14" font-weight="900" fill="#64748B" font-family="sans-serif">1,000</text>
  <text x="60" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#94A3B8" font-family="sans-serif">ALT</text>
</svg>
