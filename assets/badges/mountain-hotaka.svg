<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- アルプスブルーグラデーション -->
    <linearGradient id="hotakaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hotakaInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#DBEAFE"/>
    </linearGradient>
    <!-- 雪グラデーション -->
    <linearGradient id="snowCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
    <filter id="hotakaShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED844"/>
    </filter>
  </defs>

  <!-- 円形ベース -->
  <circle cx="60" cy="60" r="52" fill="url(#hotakaBlue)" filter="url(#hotakaShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#60A5FA" stroke-width="2"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="60" r="42" fill="url(#hotakaInner)"/>

  <!-- 北アルプスの峰々 -->
  <path d="M20,78 L35,55 L45,62 L60,42 L75,62 L85,55 L100,78 Z" fill="#3B82F6" opacity="0.6"/>

  <!-- 雪を被った山頂 -->
  <path d="M50,50 L60,42 L70,50 L65,55 L55,55 Z" fill="url(#snowCap)"/>

  <!-- 高山植物（黄色い花） -->
  <circle cx="35" cy="70" r="3" fill="#FCD34D"/>
  <circle cx="45" cy="68" r="2" fill="#FBBF24"/>
  <circle cx="75" cy="68" r="2" fill="#FBBF24"/>
  <circle cx="85" cy="70" r="3" fill="#FCD34D"/>

  <!-- 山名 -->
  <text x="60" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8" font-family="sans-serif">穂高岳</text>
  <text x="60" y="99" text-anchor="middle" font-size="8" fill="#3B82F6" font-family="sans-serif">3,190m</text>
</svg>
