<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ゴールドグラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <!-- 内側の光沢 -->
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFEF0"/>
      <stop offset="100%" style="stop-color:#FFF8DC"/>
    </linearGradient>
    <!-- 影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>
    <!-- 光るエフェクト -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外側のリング -->
  <circle cx="60" cy="60" r="54" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#FFE066" stroke-width="2"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="60" r="44" fill="url(#innerShine)"/>

  <!-- 山のアイコン -->
  <g transform="translate(60, 55)" filter="url(#glow)">
    <text text-anchor="middle" font-size="36" dominant-baseline="middle">🏔️</text>
  </g>

  <!-- バナー -->
  <path d="M20,85 Q60,95 100,85 L95,100 Q60,90 25,100 Z" fill="#DC2626"/>
  <text x="60" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="sans-serif">初登頂</text>
</svg>
