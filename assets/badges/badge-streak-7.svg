<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 炎グラデーション -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="50%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <!-- 六角形のパス -->
    <clipPath id="hexClip">
      <polygon points="60,5 110,30 110,90 60,115 10,90 10,30"/>
    </clipPath>
    <filter id="fireShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#DC262666"/>
    </filter>
  </defs>

  <!-- 六角形の背景 -->
  <polygon points="60,8 107,32 107,88 60,112 13,88 13,32" fill="url(#fireGrad)" filter="url(#fireShadow)"/>

  <!-- 内側の六角形 -->
  <polygon points="60,18 97,38 97,82 60,102 23,82 23,38" fill="#FEF3C7"/>

  <!-- 炎アイコン -->
  <g transform="translate(60, 52)">
    <text text-anchor="middle" font-size="32" dominant-baseline="middle">🔥</text>
  </g>

  <!-- 日数 -->
  <text x="60" y="85" text-anchor="middle" font-size="14" font-weight="900" fill="#DC2626" font-family="sans-serif">7日連続</text>
</svg>
