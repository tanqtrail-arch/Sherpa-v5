<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- オーロラグラデーション -->
    <linearGradient id="denaliAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="denaliInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <!-- オーロラの光 -->
    <linearGradient id="auroraLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#34D399" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#6EE7B7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="denaliShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B98144"/>
    </filter>
  </defs>

  <!-- 円形ベース -->
  <circle cx="60" cy="60" r="52" fill="url(#denaliAurora)" filter="url(#denaliShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#34D399" stroke-width="2"/>

  <!-- 内側の円（夜空） -->
  <circle cx="60" cy="60" r="42" fill="url(#denaliInner)"/>

  <!-- 星 -->
  <circle cx="35" cy="35" r="1" fill="white"/>
  <circle cx="50" cy="28" r="1.5" fill="white"/>
  <circle cx="75" cy="32" r="1" fill="white"/>
  <circle cx="85" cy="40" r="1.5" fill="white"/>
  <circle cx="40" cy="45" r="1" fill="white"/>

  <!-- オーロラ -->
  <path d="M20,50 Q35,30 50,45 Q65,25 80,40 Q95,30 100,50" fill="none" stroke="url(#auroraLight)" stroke-width="8" opacity="0.6"/>
  <path d="M25,55 Q40,40 55,50 Q70,35 85,48" fill="none" stroke="#34D399" stroke-width="3" opacity="0.4"/>

  <!-- デナリの雪山 -->
  <path d="M20,85 L40,55 L55,62 L60,50 L65,62 L80,55 L100,85 Z" fill="#E2E8F0"/>
  <path d="M50,58 L60,50 L70,58 L65,62 L55,62 Z" fill="white"/>

  <!-- 山名 -->
  <text x="60" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#34D399" font-family="sans-serif">デナリ</text>
  <text x="60" y="106" text-anchor="middle" font-size="8" fill="#6EE7B7" font-family="sans-serif">6,190m</text>
</svg>
