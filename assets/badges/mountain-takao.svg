<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 森林グリーングラデーション -->
    <linearGradient id="takaoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
    <linearGradient id="takaoInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4"/>
      <stop offset="100%" style="stop-color:#DCFCE7"/>
    </linearGradient>
    <!-- 紅葉オレンジ -->
    <linearGradient id="mapleLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
    <filter id="takaoShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#16A34A44"/>
    </filter>
  </defs>

  <!-- 円形ベース -->
  <circle cx="60" cy="60" r="52" fill="url(#takaoGreen)" filter="url(#takaoShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#4ADE80" stroke-width="2"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="60" r="42" fill="url(#takaoInner)"/>

  <!-- 山のシルエット -->
  <path d="M25,75 L45,50 L60,60 L75,45 L95,75 Z" fill="#22C55E" opacity="0.6"/>
  <path d="M30,75 L55,55 L65,62 L85,50 L90,75 Z" fill="#16A34A" opacity="0.8"/>

  <!-- 紅葉アイコン -->
  <g transform="translate(60, 42)">
    <text text-anchor="middle" font-size="24" dominant-baseline="middle">🍁</text>
  </g>

  <!-- 山名 -->
  <text x="60" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A" font-family="sans-serif">高尾山</text>
  <text x="60" y="100" text-anchor="middle" font-size="8" fill="#22C55E" font-family="sans-serif">599m</text>
</svg>
