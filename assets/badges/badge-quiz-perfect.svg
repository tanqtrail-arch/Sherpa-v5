<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 虹色グラデーション -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="25%" style="stop-color:#EC4899"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="75%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="starShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8B5CF666"/>
    </filter>
  </defs>

  <!-- 星形の背景 -->
  <polygon
    points="60,5 72,42 112,42 80,65 90,102 60,80 30,102 40,65 8,42 48,42"
    fill="url(#rainbowGrad)"
    filter="url(#starShadow)"
  />

  <!-- 内側の星 -->
  <polygon
    points="60,20 68,45 95,45 73,60 80,85 60,70 40,85 47,60 25,45 52,45"
    fill="#FDF4FF"
  />

  <!-- 100点アイコン -->
  <g transform="translate(60, 52)">
    <text text-anchor="middle" font-size="24" font-weight="900" dominant-baseline="middle" fill="#8B5CF6" font-family="sans-serif">100</text>
  </g>

  <!-- ラベル -->
  <text x="60" y="92" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B5CF6" font-family="sans-serif">PERFECT!</text>
</svg>
