<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- エメラルドグラデーション -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="emeraldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECFDF5"/>
      <stop offset="100%" style="stop-color:#D1FAE5"/>
    </linearGradient>
    <filter id="emeraldShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05966944"/>
    </filter>
  </defs>

  <!-- メダル本体 -->
  <circle cx="60" cy="60" r="52" fill="url(#emeraldGrad)" filter="url(#emeraldShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="60" r="40" fill="url(#emeraldInner)"/>

  <!-- コンパスアイコン -->
  <g transform="translate(60, 48)">
    <text text-anchor="middle" font-size="32" dominant-baseline="middle">🧭</text>
  </g>

  <!-- ラベル -->
  <text x="60" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669" font-family="sans-serif">探究者</text>
</svg>
