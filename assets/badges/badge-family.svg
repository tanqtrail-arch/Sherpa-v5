<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ピンクグラデーション -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
    <linearGradient id="pinkInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F8"/>
      <stop offset="100%" style="stop-color:#FCE7F3"/>
    </linearGradient>
    <filter id="pinkShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#DB277744"/>
    </filter>
  </defs>

  <!-- ハート形の背景 -->
  <path d="M60,100 C20,70 10,40 30,25 C45,15 60,25 60,35 C60,25 75,15 90,25 C110,40 100,70 60,100 Z" fill="url(#pinkGrad)" filter="url(#pinkShadow)"/>

  <!-- 内側のハート -->
  <path d="M60,90 C30,65 22,42 38,30 C50,22 60,30 60,38 C60,30 70,22 82,30 C98,42 90,65 60,90 Z" fill="url(#pinkInner)"/>

  <!-- 家族アイコン -->
  <g transform="translate(60, 48)">
    <text text-anchor="middle" font-size="26" dominant-baseline="middle">👨‍👩‍👧</text>
  </g>

  <!-- ラベル -->
  <text x="60" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#DB2777" font-family="sans-serif">ファミリー</text>
</svg>
