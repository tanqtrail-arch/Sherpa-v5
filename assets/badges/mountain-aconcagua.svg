<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 南米カラー（アルゼンチン国旗 + アンデス） -->
    <linearGradient id="aconBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="50%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0284C7"/>
    </linearGradient>
    <linearGradient id="aconInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF"/>
      <stop offset="100%" style="stop-color:#E0F2FE"/>
    </linearGradient>
    <!-- コンドルの羽色 -->
    <linearGradient id="condorWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <filter id="aconShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C744"/>
    </filter>
  </defs>

  <!-- 円形ベース -->
  <circle cx="60" cy="60" r="52" fill="url(#aconBlue)" filter="url(#aconShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#7DD3FC" stroke-width="2"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="60" r="42" fill="url(#aconInner)"/>

  <!-- 太陽（アルゼンチン国旗風） -->
  <circle cx="60" cy="35" r="8" fill="#FCD34D"/>
  <g transform="translate(60, 35)">
    <!-- 太陽の光線 -->
    <line x1="0" y1="-12" x2="0" y2="-15" stroke="#FBBF24" stroke-width="2"/>
    <line x1="8" y1="-9" x2="11" y2="-12" stroke="#FBBF24" stroke-width="2"/>
    <line x1="12" y1="0" x2="15" y2="0" stroke="#FBBF24" stroke-width="2"/>
    <line x1="8" y1="9" x2="11" y2="12" stroke="#FBBF24" stroke-width="2"/>
    <line x1="-8" y1="-9" x2="-11" y2="-12" stroke="#FBBF24" stroke-width="2"/>
    <line x1="-12" y1="0" x2="-15" y2="0" stroke="#FBBF24" stroke-width="2"/>
    <line x1="-8" y1="9" x2="-11" y2="12" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <!-- アコンカグアの山 -->
  <path d="M15,82 L35,55 L50,60 L60,45 L70,60 L85,55 L105,82 Z" fill="#0EA5E9" opacity="0.6"/>
  <path d="M50,55 L60,45 L70,55 L65,60 L55,60 Z" fill="white"/>

  <!-- コンドルのシルエット -->
  <path d="M30,55 L35,52 L40,50 L42,52 L40,53 L35,53 Z" fill="url(#condorWing)" opacity="0.7"/>
  <path d="M90,55 L85,52 L80,50 L78,52 L80,53 L85,53 Z" fill="url(#condorWing)" opacity="0.7"/>

  <!-- 山名 -->
  <text x="60" y="92" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284C7" font-family="sans-serif">アコンカグア</text>
  <text x="60" y="103" text-anchor="middle" font-size="8" fill="#0EA5E9" font-family="sans-serif">6,962m</text>
</svg>
