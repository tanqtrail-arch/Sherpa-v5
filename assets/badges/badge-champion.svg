<svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ゴールドグラデーション -->
    <linearGradient id="champGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="champInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
    <!-- リボンの赤 -->
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#DC2626"/>
    </linearGradient>
    <filter id="champShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#D9770644"/>
    </filter>
  </defs>

  <!-- リボン左 -->
  <path d="M25,75 L15,130 L35,115 L45,130 L50,80 Z" fill="url(#ribbonRed)"/>
  <!-- リボン右 -->
  <path d="M95,75 L105,130 L85,115 L75,130 L70,80 Z" fill="url(#ribbonRed)"/>

  <!-- メダル本体 -->
  <circle cx="60" cy="55" r="48" fill="url(#champGold)" filter="url(#champShadow)"/>

  <!-- 装飾リング -->
  <circle cx="60" cy="55" r="42" fill="none" stroke="#FBBF24" stroke-width="3"/>
  <circle cx="60" cy="55" r="38" fill="none" stroke="#FCD34D" stroke-width="1"/>

  <!-- 内側の円 -->
  <circle cx="60" cy="55" r="35" fill="url(#champInner)"/>

  <!-- 王冠アイコン -->
  <g transform="translate(60, 45)">
    <text text-anchor="middle" font-size="32" dominant-baseline="middle">👑</text>
  </g>

  <!-- ラベル -->
  <text x="60" y="78" text-anchor="middle" font-size="10" font-weight="900" fill="#D97706" font-family="sans-serif">CHAMPION</text>
</svg>
